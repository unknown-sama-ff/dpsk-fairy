name: 问题反馈
description: 皮肤没装好、显示异常、语音不对
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前先看一眼 [常见问题](https://github.com/unknown-sama-ff/dpsk-fairy#readme) 和 `docs/`。

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 设置 → 关于，或启动画面里的版本号
      placeholder: 0.2.1-rc.3
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的部分
      options:
        - 安装 / 卸载脚本
        - 主题配色（闪白、浅色残留）
        - 开屏动画 / 徽记 / 气泡
        - 输入框 / 插话 / 排队消息
        - 语音（本地 GPT-SoVITS）
        - 语音（edge 回退）
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 看到了什么、期望是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 装完重启
        2. 打开设置切模型
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图 / 日志
      description: 能截图最好；Host 日志在 DSH 的日志面板里
      render: text
    validations:
      required: false
