<!doctype html>
<html lang="zh-CN" class="fairy-on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAIRY · 设计预览</title>
<link rel="stylesheet" href="/fairy/assets/fairy.css">
<style>
  html, body { height: 100%; margin: 0; background: #03070d; }
  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 260px 1fr; height: 100%; color: #e3effb; font: 13px/1.6 "Bahnschrift", "Microsoft YaHei", sans-serif; }
  .side { padding: 14px 14px 0; background: rgba(4, 10, 19, 0.66); border-right: 1px solid rgba(126, 220, 255, 0.1); display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 4px 10px; }
  .brand .name { font-weight: 600; letter-spacing: 0.14em; font-size: 15px; }
  .brand .name b { color: #7edcff; }
  .brand .tag { margin-left: auto; font-size: 8px; letter-spacing: 0.24em; color: rgba(126, 220, 255, 0.45); border: 1px solid rgba(126, 220, 255, 0.2); padding: 3px 6px; border-radius: 4px; }
  .new { height: 38px; border: 1px solid rgba(126, 220, 255, 0.16); border-radius: 10px; background: rgba(9, 20, 34, 0.6); display: grid; place-items: center; color: #bfe6ff; letter-spacing: 0.06em; }
  .nav { display: grid; gap: 4px; color: #a9c3da; }
  .nav span { padding: 7px 8px; border-radius: 7px; }
  .nav span.on { background: rgba(30, 64, 110, 0.6); color: #e6f5ff; }
  .label { font-size: 10px; letter-spacing: 0.22em; color: rgba(126, 220, 255, 0.38); padding: 4px 8px; }
  .rows { display: grid; gap: 3px; color: #a9c3da; font-size: 12px; }
  .rows span { padding: 6px 8px; border-radius: 6px; }
  .rows span.on { background: rgba(30, 64, 110, 0.6); color: #e6f5ff; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-bottom: 1px solid rgba(126, 220, 255, 0.08); }
  .top .title { font-size: 15px; }
  .top .chip { font-size: 9px; letter-spacing: 0.18em; color: rgba(126, 220, 255, 0.55); border: 1px solid rgba(126, 220, 255, 0.18); border-radius: 999px; padding: 3px 9px; }
  .thread { flex: 1; padding: 26px 34px; display: grid; align-content: start; gap: 18px; max-width: 820px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; background: rgba(22, 48, 80, 0.55); border: 1px solid rgba(126, 220, 255, 0.12); }
  .msg.me { margin-left: auto; background: rgba(34, 68, 110, 0.6); }
  .composer { margin: 0 26px 22px; border: 1px solid rgba(126, 220, 255, 0.18); border-radius: 16px; background: rgba(7, 18, 30, 0.86); padding: 14px 16px; color: rgba(161, 190, 214, 0.75); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4); }
  .composer .bar { display: flex; gap: 8px; margin-top: 14px; font-size: 10px; letter-spacing: 0.14em; color: rgba(126, 220, 255, 0.5); }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span id="brand-mark" style="width:22px;height:22px;display:inline-flex"></span>
      <span class="name">FAIRY </span>
      <span class="tag">H.D.D.</span>
    </div>
    <div class="new">+ 新会话</div>
    <div class="nav"><span>◇ 插件</span><span>◷ 自动化任务</span></div>
    <div class="label">工作区</div>
    <div class="rows">
      <span>revitt</span>
      <span>默认工作区</span>
      <span class="on">改造 DeepSeek harness 界面</span>
      <span>SVG 循环动画</span>
    </div>
  </aside>
  <section class="main">
    <div class="top"><span class="title">改造 DeepSeek harness 界面</span><span class="chip">CREATION MODE</span></div>
    <div class="thread">
      <div class="msg me">把界面改成绝区零 HDD 的样子，要有 Fairy 的徽记。</div>
      <div class="msg">已接入 H.D.D. 皮肤。徽记在左下角，点击可以对话。</div>
      <div class="msg">开屏动画、问候语和语音都已就位，主人。</div>
    </div>
    <div class="composer">发消息或创建任务，/ 调用指令，@ 文件或对话
      <div class="bar"><span>＋</span><span>完全权限</span><span style="margin-left:auto">DeepSeek-V4.1-Flash</span></div>
    </div>
  </section>
</div>
<script src="/fairy/assets/preview.js"></script>
</body>
</html>
